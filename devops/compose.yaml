name: solarshare-devops

services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: solarshare
      MYSQL_USER: solarshare
      MYSQL_PASSWORD: solarshare-local-test
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    volumes:
      - mysql-data:/var/lib/mysql

  app:
    image: solarshare-devops-php:latest
    depends_on:
      - db
    ports:
      - "127.0.0.1:8002:8000"
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8000"]
    environment:
      APP_ENV: local
      APP_URL: http://localhost:8002
      APP_KEY: ${SOLARSHARE_DEVOPS_KEY:?Genere la cle locale avant de demarrer}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: solarshare
      DB_USERNAME: solarshare
      DB_PASSWORD: solarshare-local-test

volumes:
  mysql-data: